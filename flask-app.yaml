
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app
        image: harshporwal01/flask-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5050

---
apiVersion: v1
kind: Service

metadata:
  name: flask-service

spec:
  type: NodePort

  selector:
    app: flask-app

  ports:
  - protocol: TCP
    port: 5050
    targetPort: 5050
    nodePort: 30007

